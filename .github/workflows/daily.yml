name: Daily UMN menu

on:
  # PAUSED (Nov 2026): Dine On Campus returned HTTP 403 to the menu reads. Waiting for their reply.
  # To resume, uncomment the next two lines.
  # schedule:
  #   - cron: "23 10 * * *"   # once a day: 4:23 AM Central in winter, 5:23 AM in summer (GitHub may start it a few minutes late)
  workflow_dispatch:
    inputs:
      fetch:
        description: "Read today's UMN menu (leave on for a normal update)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["app/**", "scripts/build.mjs"]   # app changes rebuild the site without reading menus

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Offline tests
        run: node tests/run-tests.mjs

      - name: Read today's UMN menu (once a day only)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.fetch)
        run: node scripts/fetch-umn.mjs

      - name: Save the new menu
        if: github.event_name != 'push'
        run: |
          git config user.name "plate-math-bot"
          git config user.email "plate-math-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No menu change to save."; exit 0; fi
          git commit -m "Menu update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build site
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
